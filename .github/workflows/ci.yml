name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# 同一分支的新提交会取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 先构建：体积闸门需要读取 dist 产物
      - name: 构建
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 工程约束自检
        run: npm run check
