<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
  </defs>

  <!-- 品牌渐变底 -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>

  <!-- AI 轨道（虚线圆环） -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="3.5 5.5" stroke-linecap="round"/>

  <!-- 导航罗盘针（指向右上 45°） -->
  <g transform="rotate(45 32 32)">
    <path d="M32 12.5 L37.6 32 L32 51.5 L26.4 32 Z" fill="#ffffff"/>
    <path d="M32 51.5 L26.4 32 L32 32 Z" fill="rgba(16,32,88,.28)"/>
  </g>

  <!-- 中心枢轴 -->
  <circle cx="32" cy="32" r="3.6" fill="#4f7cff"/>
  <circle cx="32" cy="32" r="1.7" fill="#ffffff"/>

  <!-- AI 火花 -->
  <circle cx="46.5" cy="17.5" r="2.3" fill="#ffffff"/>
  <circle cx="51" cy="25" r="1.4" fill="#ffffff" opacity=".75"/>
</svg>
